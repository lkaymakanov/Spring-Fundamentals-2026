<!DOCTYPE html>
<html lang="en" xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&amp;display=swap" rel="stylesheet">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" type="text/css" href="/css/common.css">
    <link rel="stylesheet" type="text/css" href="/css/nav-side-bar.css">
    <link rel="stylesheet" type="text/css" href="/css/home-common.css">
    <link rel="stylesheet" type="text/css" href="/css/author-management.css">
    <title>Authors - Library</title>
</head>
<body>
<main>
    <div class="nav-bar">
        <div class="side-bar-container">
            <nav>
                <div class="side_navbar">
                    <div class="func-block">
                        <a href="/home">
                            <p>Dashboard</p>
                            <svg aria-hidden="true" xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="none" viewBox="0 0 24 24">
                                <path stroke="currentColor" stroke-linecap="round" stroke-width="2" d="M5 7h14M5 12h14M5 17h14"></path>
                            </svg>
                        </a>
                        <a href="/books">
                            <p>Browse Books</p>
                            <svg aria-hidden="true" xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="currentColor" viewBox="0 0 24 24">
                                <path d="M6 2a2 2 0 0 0-2 2v15a3 3 0 0 0 3 3h12a1 1 0 1 0 0-2H7a1 1 0 1 1 0-2h12V2H6Z"></path>
                            </svg>
                        </a>
                        <a href="/authors" class="active">
                            <p>Authors</p>
                            <svg aria-hidden="true" xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="none" viewBox="0 0 24 24">
                                <path stroke="currentColor" stroke-linecap="round" stroke-width="2" d="M16 7a4 4 0 1 1-8 0 4 4 0 0 1 8 0Zm-4 7a7 7 0 0 0-7 7h14a7 7 0 0 0-7-7Z"></path>
                            </svg>
                        </a>
                    </div>
                    <div class="func-block">
                        <a class="logout" href="/logout">
                            <p>Logout</p>
                            <svg aria-hidden="true" xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="none" viewBox="0 0 24 24">
                                <path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20 12H8m12 0-4 4m4-4-4-4M9 4H7a3 3 0 0 0-3 3v10a3 3 0 0 0 3 3h2"></path>
                            </svg>
                        </a>
                    </div>
                </div>
            </nav>
        </div>
    </div>

    <div class="home-section">
        <!-- Flash messages -->
        <div th:if="${successMessage}" class="success-banner">
            <span th:text="${successMessage}">Success!</span>
        </div>
        <div th:if="${errorMessage}" class="error-banner">
            <span th:text="${errorMessage}">Error</span>
        </div>

        <div class="page-header">
            <div>
                <h1>✍️ Authors</h1>
                <p>Browse the writers whose works fill our shelves.</p>
            </div>
            <button th:if="${isAdmin}" class="button primary-btn" onclick="document.getElementById('addModal').classList.add('open')">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"/>
                </svg>
                Add New Author
            </button>
        </div>

        <div class="search-bar">
            <form action="/authors" method="get">
                <input type="text" name="search" placeholder="Search authors by name..." th:value="${search}">
                <button type="submit" class="button">Search</button>
            </form>
        </div>

        <div th:if="${#lists.isEmpty(authors)}" class="empty-state">
            <p>No authors found. Try a different search term.</p>
        </div>

        <div th:if="${not #lists.isEmpty(authors)}" class="authors-grid">
            <div class="author-card" th:each="author : ${authors}">
                <div class="author-avatar" th:text="${#strings.substring(author.name, 0, 1).toUpperCase()}">A</div>
                <div class="author-info">
                    <h3 th:text="${author.name}">Name</h3>
                    <p class="author-bio" th:text="${author.bio != null ? author.bio : 'No biography available.'}">Bio</p>
                    <p class="author-meta">
                        <span class="book-count-badge" th:text="${bookCounts != null and bookCounts.containsKey(author.id) ? bookCounts.get(author.id) : 0}">0</span>
                        book(s) in catalog
                    </p>
                </div>
                <div th:if="${isAdmin}" class="admin-actions">
                    <button class="icon-btn edit-btn"
                            th:attr="data-id=${author.id},
                           data-name=${author.name},
                           data-bio=${author.bio}"
                            onclick="openEditModal(this)">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                            <path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5H6a2 2 0 0 0-2 2v11a2 2 0 0 0 2 2h11a2 2 0 0 0 2-2v-5m-1.414-9.414a2 2 0 1 1 2.828 2.828L11.828 15H9v-2.828l8.586-8.586Z"/>
                        </svg>
                    </button>
                    <form th:action="@{/admin/authors/delete/{id}(id=${author.id})}" method="post" style="display:inline"
                          th:attr="onsubmit=|return confirmDelete(${bookCounts != null and bookCounts.containsKey(author.id) ? bookCounts.get(author.id) : 0});|">
                        <button type="submit" class="icon-btn delete-btn">
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                                <path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0 1 16.138 21H7.862a2 2 0 0 1-1.995-1.858L5 7m5 4v6m4-6v6M1 7h22M9 7V4a2 2 0 0 1 2-2h2a2 2 0 0 1 2 2v3"/>
                            </svg>
                        </button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</main>

<!-- Modals: only rendered if user is admin -->
<th:block th:if="${isAdmin}">
    <!-- ADD MODAL -->
    <div id="addModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>Add New Author</h2>
                <button class="close-btn" type="button" onclick="document.getElementById('addModal').classList.remove('open')">&times;</button>
            </div>
            <form th:action="@{/admin/authors/create}" th:object="${authorCreateRequest}" method="post" class="modal-form">
                <div class="form-group">
                    <label for="addName">Name <span class="required">*</span></label>
                    <input type="text" id="addName" th:field="*{name}" required>
                </div>
                <div class="form-group">
                    <label for="addBio">Biography</label>
                    <textarea id="addBio" th:field="*{bio}" rows="4" maxlength="1000" placeholder="A short biography of the author..."></textarea>
                </div>
                <div class="modal-actions">
                    <button type="button" class="button secondary-btn" onclick="document.getElementById('addModal').classList.remove('open')">Cancel</button>
                    <button type="submit" class="button primary-btn">Add Author</button>
                </div>
            </form>
        </div>
    </div>

    <!-- EDIT MODAL -->
    <div id="editModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>Edit Author</h2>
                <button class="close-btn" type="button" onclick="document.getElementById('editModal').classList.remove('open')">&times;</button>
            </div>
            <form id="editForm" method="post" class="modal-form">
                <div class="form-group">
                    <label for="editName">Name <span class="required">*</span></label>
                    <input type="text" id="editName" name="name" required>
                </div>
                <div class="form-group">
                    <label for="editBio">Biography</label>
                    <textarea id="editBio" name="bio" rows="4" maxlength="1000"></textarea>
                </div>
                <div class="modal-actions">
                    <button type="button" class="button secondary-btn" onclick="document.getElementById('editModal').classList.remove('open')">Cancel</button>
                    <button type="submit" class="button primary-btn">Save Changes</button>
                </div>
            </form>
        </div>
    </div>
</th:block>

<div class="footer"><p>© 2026 Spring course library. All rights reserved.</p></div>

<script>
    function openEditModal(btn) {
        const form = document.getElementById('editForm');
        const id = btn.getAttribute('data-id');
        form.action = '/admin/authors/edit/' + id;
        document.getElementById('editName').value = btn.getAttribute('data-name') || '';
        document.getElementById('editBio').value = btn.getAttribute('data-bio') || '';
        document.getElementById('editModal').classList.add('open');
    }

    function confirmDelete(bookCount) {
        if (bookCount > 0) {
            return confirm('This author has ' + bookCount + ' book(s) in the catalog. Delete anyway? This will leave those books without an author.');
        }
        return confirm('Delete this author?');
    }

    document.querySelectorAll('.modal').forEach(modal => {
        modal.addEventListener('click', e => {
            if (e.target === modal) modal.classList.remove('open');
        });
    });
</script>
</body>
</html>
